<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contacts - Contact Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>📱 Contact Manager</h2>

    <div>

        <a href="index.html">Home</a>

        <a href="contacts.html">Contacts</a>

        <a href="bst.html">BST</a>

        <a href="hashing.html">Hashing</a>

    </div>

</nav>


<div class="container">

    <div class="title">

        <h1>Contact Management</h1>

        <p>
            Add, search, view and delete your contacts
        </p>

    </div>


    <!-- ================= ADD CONTACT ================= -->

    <div class="form-box">

        <h2>➕ Add New Contact</h2>

        <div class="form-group">

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
            >

            <input
                type="text"
                id="phone"
                placeholder="Enter Phone Number"
            >

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
            >

        </div>

        <button onclick="addContact()">
            Add Contact
        </button>

        <div
            class="message"
            id="message">
        </div>

    </div>


    <!-- ================= SEARCH ================= -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search by name or phone..."
            onkeyup="displayContacts()"
        >

    </div>


    <!-- ================= CONTACT TABLE ================= -->

    <div class="table-box">

        <h2>📋 Contact List</h2>

        <table>

            <thead>

                <tr>

                    <th>S.No</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="contactTable">

            </tbody>

        </table>

    </div>

</div>


<footer>

    <p>
        Contact Management System | BST & Hashing Project
    </p>

</footer>


<script>

    // =====================================================
    // CONTACT ARRAY
    // =====================================================

    let contacts = [];


    // =====================================================
    // LOAD CONTACTS FROM MYSQL DATABASE
    // =====================================================

    async function loadContactsFromDatabase() {

        try {

            const response =
                await fetch("get_contacts.php");

            if (!response.ok) {

                throw new Error(
                    "Unable to connect to PHP"
                );

            }

            contacts =
                await response.json();

            displayContacts();

        }

        catch (error) {

            console.error(error);

            document.getElementById("message").innerHTML =
                "❌ Unable to load contacts from database.";

        }

    }


    // =====================================================
    // ADD CONTACT
    // =====================================================

    async function addContact() {

        const name =
            document
                .getElementById("name")
                .value
                .trim();

        const phone =
            document
                .getElementById("phone")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const message =
            document.getElementById("message");


        // Check empty fields

        if (
            name === "" ||
            phone === "" ||
            email === ""
        ) {

            message.innerHTML =
                "⚠️ Please fill all fields.";

            return;

        }


        try {

            // Create form data

            const formData =
                new FormData();

            formData.append(
                "name",
                name
            );

            formData.append(
                "phone",
                phone
            );

            formData.append(
                "email",
                email
            );


            // Send data to PHP

            const response =
                await fetch(
                    "add_contact.php",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const result =
                await response.text();


            // Check result

            if (
                result.includes(
                    "Contact added successfully!"
                )
            ) {

                message.innerHTML =
                    "✅ Contact added successfully!";


                // Clear input fields

                document.getElementById(
                    "name"
                ).value = "";

                document.getElementById(
                    "phone"
                ).value = "";

                document.getElementById(
                    "email"
                ).value = "";


                // Reload contacts from MySQL

                await loadContactsFromDatabase();

            }

            else {

                message.innerHTML =
                    "⚠️ " + result;

            }

        }

        catch (error) {

            console.error(error);

            message.innerHTML =
                "❌ Database connection error.";

        }

    }


    // =====================================================
    // DISPLAY CONTACTS
    // =====================================================

    function displayContacts() {

        const table =
            document.getElementById(
                "contactTable"
            );

        const search =
            document
                .getElementById("search")
                .value
                .toLowerCase()
                .trim();


        table.innerHTML = "";


        // Filter contacts

        const filteredContacts =
            contacts.filter(contact =>

                contact.name
                    .toLowerCase()
                    .includes(search)

                ||

                contact.phone
                    .toLowerCase()
                    .includes(search)

            );


        // No contacts

        if (
            filteredContacts.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="empty">

                        No contacts found.

                    </td>

                </tr>

            `;

            return;

        }


        // Display contacts

        filteredContacts.forEach(
            (contact, index) => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${contact.name}
                        </td>

                        <td>
                            ${contact.phone}
                        </td>

                        <td>
                            ${contact.email}
                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteContact(${contact.id})">
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            }
        );

    }


    // =====================================================
    // DELETE CONTACT FROM MYSQL
    // =====================================================

    async function deleteContact(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this contact?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const formData =
                new FormData();

            formData.append(
                "id",
                id
            );


            const response =
                await fetch(
                    "delete_contact.php",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const result =
                await response.text();


            if (
                result.includes(
                    "Contact deleted successfully!"
                )
            ) {

                document.getElementById(
                    "message"
                ).innerHTML =
                    "✅ Contact deleted successfully!";


                // Reload contacts from MySQL

                await loadContactsFromDatabase();

            }

            else {

                document.getElementById(
                    "message"
                ).innerHTML =
                    "⚠️ " + result;

            }

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "message"
            ).innerHTML =
                "❌ Database connection error.";

        }

    }


    // =====================================================
    // LOAD PAGE
    // =====================================================

    loadContactsFromDatabase();

</script>


</body>

</html>
